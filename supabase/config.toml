project_id = "babfull-mania"

[auth]
site_url = "https://babfullmania.vercel.app"
additional_redirect_urls = ["http://127.0.0.1:4173/**", "http://localhost:4173/**", "https://babfullmania.vercel.app/**"]

[auth.external.kakao]
enabled = true
client_id = "env(KAKAO_REST_API_KEY)"
secret = "env(KAKAO_LOGIN_CLIENT_SECRET)"
email_optional = false

[functions.import-yeongjun-menu]
verify_jwt = false

[functions.estimate-meal-calories]
verify_jwt = true

[functions.resolve-food-images]
verify_jwt = false
